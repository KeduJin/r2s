Settings:
  project_name: TED-DPLM
  outdir: output
  tags:
  - AR
  - Reaction2Seq
  - Qwen3CAwReactionConditional
Model:
  supports_gradient_checkpointing: false
  kwargs:
    class_name: models.Qwen3CAwReactionConditioning.Qwen3CAwReactionConditioning
    qwen3_type: Qwen/Qwen3-100M
    chemberta_model_name_or_path: /jinkedu/enzyme-design/DeepChem/ChemBERTa-77M-MLM
    reaction_tokenizer_name_or_path: /jinkedu/enzyme-design/DeepChem/ChemBERTa-77M-MLM
    seq_tokenizer_name_or_path: /jinkedu/enzyme-design/airkingbd/dplm_150m
    encoder_pack_max_len: 1024
    freeze_reaction_encoder: false
  Optimizer_kwargs:
    class_name: torch.optim.AdamW
    lr: 0.0001
    weight_decay: 0.01
    betas:
    - 0.9
    - 0.98
  Scheduler_kwargs:
    class_name: utils.scheduler.get_cosine_with_hard_min_lr_schedule
    num_warmup_steps: 1000
    num_training_steps: 500000
    min_lr_ratio: 0.1
Datamodule:
  kwargs:
    class_name: dataloader.datamodules.reactionsplit_datamodule.ReactionSplitDataModule
    train_split_path: ${REACTION2SEQ_DATA_DIR}/splits/train_repid-entryid.tsv
    val_split_path: ${REACTION2SEQ_DATA_DIR}/splits/valid_repid-entryid.tsv
    test_split_path: ${REACTION2SEQ_DATA_DIR}/splits/test_repid-entryid.tsv
    seq_lmdb_path: ${REACTION2SEQ_DATA_DIR}/processed/LMDB_seqonly
    reaction_lmdb_path: ${REACTION2SEQ_DATA_DIR}/processed/LMDB_reaction_smiles
    raw_reaction_lmdb_path: ${REACTION2SEQ_DATA_DIR}/processed/LMDB_raw_reaction
    source_lmdb_path: ${REACTION2SEQ_DATA_DIR}/processed/LMDB_source
    cluster_lmdb_path: ${REACTION2SEQ_DATA_DIR}/processed/LMDB_train_cluster
    num_workers_per_gpu: 8
    per_gpu_batchsize: 32
    eval_batch_size: 32
    max_aa_seq_len: 1024
    condition_max_len: 512
Trainer:
  seed: 123
  max_steps: 200000
  max_epochs: -1
  accumulate_grad_batches: 1
  val_every_n_steps: 200
  log_every_n_steps: 10
  save_every_n_steps: 5000
  val_before_train: true
  watch_t1_t2_loss: false
  cal_constant_loss: false
  trackers:
  - wandb
  - tensorboard
  kwargs:
    class_name: experiments.experiments.R2S.R2S
